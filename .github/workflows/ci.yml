name: Continous Integration (build)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ "main" ]

jobs:
  build-Release:
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest', 'macos-latest', 'ubuntu-latest' ]
        compiler: [ 'cl', 'clang', 'gcc' ]
        generator: [ 'Visual Studio 17 2022', 'MinGW Makefiles', 'Xcode', 'Ninja', 'Unix Makefiles' ]
        shared-libs: [ false, true ]
        build-type: [ 'Release', 'RelWithDebInfo' ]
        upload-outputs: [ false ]
        include:
          - os: 'windows-latest'
            compiler: 'cl'
            generator: 'Visual Studio 17 2022'
            shared-libs: true
            build-type: 'Release'
            upload-outputs: true
          - os: 'windows-latest'
            compiler: 'cl'
            generator: 'Visual Studio 17 2022'
            shared-libs: true
            build-type: 'RelWithDebInfo'
            upload-outputs: true

          - os: 'macos-latest'
            compiler: clang
            generator: 'Xcode'
            shared-libs: true
            build-type: 'Release'
            upload-outputs: true
          - os: 'macos-latest'
            compiler: clang
            generator: 'Xcode'
            shared-libs: true
            build-type: 'RelWithDebInfo'
            upload-outputs: true

          - os: 'ubuntu-latest'
            compiler: 'gcc'
            generator: 'Unix Makefiles'
            shared-libs: true
            build-type: 'Release'
            upload-outputs: true
          - os: 'ubuntu-latest'
            compiler: 'gcc'
            generator: 'Unix Makefiles'
            shared-libs: true
            build-type: 'RelWithDebInfo'
            upload-outputs: true

        exclude:          
          - os: 'windows-latest'
            compiler: 'cl'
            generator: 'Visual Studio 17 2022'
            shared-libs: true
            upload-outputs: false
          - os: 'macos-latest'
            compiler: clang
            generator: 'Xcode'
            shared-libs: true
            upload-outputs: false
          - os: 'ubuntu-latest'
            compiler: 'gcc'
            generator: 'Unix Makefiles'
            shared-libs: true
            upload-outputs: false

          - os: 'windows-latest'
            generator: 'Xcode'
          - os: 'windows-latest'
            generator: 'Unix Makefiles'
          - os: 'macos-latest'
            generator: 'Visual Studio 17 2022'
          - os: 'macos-latest'
            generator: 'MinGW Makefiles'
          - os: 'ubuntu-latest'
            generator: 'Visual Studio 17 2022'
          - os: 'ubuntu-latest'
            generator: 'Xcode'
          - os: 'ubuntu-latest'
            generator: 'MinGW Makefiles'

          - os: 'windows-latest'
            generator: 'Visual Studio 17 2022'
            compiler: 'clang'
          - os: 'windows-latest'
            generator: 'Visual Studio 17 2022'
            compiler: 'gcc'
          - os: 'windows-latest'
            generator: 'MinGW Makefiles'
            compiler: 'cl'
          - os: 'windows-latest'
            generator: 'Ninja'
            compiler: 'cl'
          - os: 'macos-latest'
            compiler: 'cl'
          - os: 'macos-latest'
            generator: 'Xcode'
            compiler: 'gcc'
          - os: 'ubuntu-latest'
            compiler: 'cl'

    name: ${{ matrix.build-type }} build for ${{ matrix.os }} with ${{ matrix.generator }} and ${{ matrix.compiler }}, shared libraries - ${{ matrix.shared-libs}}
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      generator: ${{ matrix.generator }}
      shared-libs: ${{ matrix.shared-libs }}
      build-type: ${{ matrix.build-type }}
      upload-outputs: ${{ matrix.upload-outputs }}

  win-msi:
    name: Build Windows installer
    needs: build-Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WiX toolset
        run: |
          curl.exe -LO https://github.com/wixtoolset/wix/releases/download/v6.0.1/wix-cli-x64.msi
          msiexec /i wix-cli-x64.msi /quiet

      - name: Download zip
        uses: actions/download-artifact@v4
        with:
          name: build-win-MSVC-Release
          path: ${{ github.ref_name }}

      - name: Build installer
        id: build
        run: |
          $packageName = "${{ github.ref_name }}"
          $version = "1.0.0"
          powershell -ExecutionPolicy Bypass -File .\.github\scripts\build-msi.ps1 `
            -SourceDir .\$packageName `
            -AppName "$packageName" `
            -Manufacturer "Johnny Cena" `
            -Version "$version" `
            -OutputMsi "$packageName-$version.msi"
          echo "installer-path=$packageName-$version.msi" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Test installer
        id: test
        run: |
          $proc = Start-Process -FilePath msiexec.exe `
            -ArgumentList '/i "${{ steps.build.outputs.installer-path }}" /norestart /quiet' `
            -PassThru
          $proc.WaitForExit(30000)
          dir "C:\Program Files\${{ github.ref_name }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.build.outputs.installer-path }}
          name: Windows installer

  linux-deb:
    name: Build Debian package
    needs: build-Release
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-linux-Makefiles-Release
          path: ${{ github.workspace }}

      - name: Build
        id: build
        run: |
          sudo apt-get update && sudo apt-get install -y libopengl0 libglu1-mesa
          PACKAGE_NAME=${{ github.ref_name }}
          chmod +x ./$PACKAGE_NAME
          PACKAGE_VERSION=$(./$PACKAGE_NAME --version --minimal-output)
          PACKAGE_DESCRIPTION="$(./$PACKAGE_NAME --description)"
          PACKAGE_DESCRIPTION_MINIMAL="$(./$PACKAGE_NAME --description --minimal-output)"
          PACKAGE_REPO="$(./$PACKAGE_NAME --repo --minimal-output)"
          PACKAGE_DIR="./$PACKAGE_NAME-$PACKAGE_VERSION"
          mkdir -p "$PACKAGE_DIR"/usr/bin
          mv "./$PACKAGE_NAME" "$PACKAGE_DIR/usr/bin/"
          ln -sf libraylib.so.5.5.0 libraylib.so.550
          ln -sf libraylib.so.5.5.0 libraylib.so
          mkdir -p "$PACKAGE_DIR"/usr/lib/$PACKAGE_NAME
          mv ./*.so* "$PACKAGE_DIR/usr/lib/$PACKAGE_NAME/"

          mkdir -p "$PACKAGE_DIR/usr/share/$PACKAGE_NAME/"
          cp -r ./resources "$PACKAGE_DIR/usr/share/$PACKAGE_NAME/"
          ICON_DIR="usr/share/icons"
          mkdir -p "$PACKAGE_DIR/$ICON_DIR"
          ICON_PATH="$ICON_DIR/$PACKAGE_NAME.png"
          cp ./resources/icon.png "$PACKAGE_DIR/$ICON_PATH"
          rm -rf resources

          mkdir -p "$PACKAGE_DIR/usr/share/applications/"
          cat <<EOF > "$PACKAGE_DIR/usr/share/applications/$PACKAGE_NAME.desktop"
          [Desktop Entry]
          Version=1.0
          Name=$PACKAGE_NAME
          GenericName=$PACKAGE_NAME
          Icon=/$ICON_PATH
          Comment=$PACKAGE_DESCRIPTION_MINIMAL. Source code: $PACKAGE_REPO.
          Exec=/usr/bin/$PACKAGE_NAME
          TryExec=/usr/bin/$PACKAGE_NAME
          Terminal=false
          Type=Application
          Categories=Utility;Game;
          Keywords=Game;$PACKAGE_NAME;Raylib;C;CPP;
          EOF

          mkdir -p $PACKAGE_DIR/DEBIAN
          cat <<EOF > "$PACKAGE_DIR/DEBIAN/control"
          Package: $PACKAGE_NAME
          Version: $PACKAGE_VERSION
          Section: utils
          Depends: libc6, libopengl0, libglx0, libglu1-mesa, libstdc++6, libgcc-s1, libx11-6, libxcb1
          Priority: optional
          Architecture: amd64
          Maintainer: Johnny Cena <iamahuman1395@gmail.com>
          Description: $PACKAGE_DESCRIPTION_MINIMAL
            $(echo "$PACKAGE_DESCRIPTION" | sed 's/^/  /')
            Source code is in $PACKAGE_REPO.
          EOF

          dpkg-deb --build "$PACKAGE_DIR" "$PACKAGE_DIR".deb

          echo "package-path=$PACKAGE_DIR.deb" >> $GITHUB_OUTPUT
        shell: bash

      - name: Test package
        run: |
          sudo dpkg -i ${{ steps.build.outputs.package-path }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.build.outputs.package-path }}
          name: Debian package

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [ linux-deb, win-msi ]
    permissions:
      contents: write

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4

      - name: Organize
        id: organize
        run: |
          rm -rf "Debian package" "Windows installer"
          mv build-win-MSVC-Release/resources .
          rm -rf */resources

          mkdir Release
          mkdir RelWithDebInfo
          mv build-*-RelWithDebInfo RelWithDebInfo/
          mv build-* Release/

          for config in Release RelWithDebInfo; do

            cd $config
              cd build-win-MSVC-$config && touch ./.portable-application && zip -r ../Windows.zip * && cd ..

              cd build-mac-Xcode-$config
                touch ./.portable-application
                ln -sf libraylib-$config.5.5.0.dylib libraylib-$config.550.dylib
                ln -sf libraylib-$config.550.dylib libraylib-$config.dylib
                tar -czvf ../MacOS.tar.gz *
              cd ..
              cd build-linux-Makefiles-$config
                touch ./.portable-application
                ln -sf libraylib-$config.so.5.5.0 libraylib-$config.so.550
                ln -sf libraylib-$config.so.550 libraylib-$config.so
                tar -czvf ../MacOS.tar.gz *
              cd ..
            cd ..
          done
        shell: bash

      - name: Upload Release zip
        uses: actions/upload-artifact@v4
        with:
          path: |
            Release/*.zip
            Release/*.tar.gz
          name: Release Builds

      - name: Upload RelWithDebInfo zip
        uses: actions/upload-artifact@v4
        with:
          path: |
            RelWithDebInfo/*.zip
            RelWithDebInfo/*.tar.gz
          name: RelWithDebInfo Builds

      - name: Upload resources zip
        uses: actions/upload-artifact@v4
        with:
          path: resources/*
          name: resources

      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build-*

  publish:
    name: Publish
    permissions:
      contents: write
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Windows installer

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: Debian package

      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          name: Release Builds

      - name: Download resources
        uses: actions/download-artifact@v4
        with:
          name: resources
          path: ./resources

      - name: Re-zip resources
        run: cd resources && zip -r ../resources.zip * && cd ..

      - name: Delete tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: nightly-${{ github.ref_name }}
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.ref_name }}
          name: Development build for ${{ github.ref_name }}
          body: |
            Build triggered by commit ${{ github.sha }} on branch ${{ github.ref_name }}.
            This is a build of the **latest commit**, it is not guaranteed to be stable.
          draft: false
          prerelease: true
          files: |
            *.msi
            *.deb
            *.zip
            *.tar.gz
